name: CI

on:
  push:
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  web-bundle-smoke:
    name: Web bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo export (web)
        run: npx expo export --platform web --output-dir dist-ci
        env:
          CI: true

      - name: Verify index.html exists
        run: test -f dist-ci/index.html

  android-bundle-smoke:
    name: Android bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo export (Android JS bundle)
        run: npx expo export --platform android --output-dir dist-android-ci
        env:
          CI: true

      - name: Verify bundle exists
        run: |
          ls dist-android-ci/
          find dist-android-ci -name '*.js' | head -5
