name: CI

on:
  push:
  pull_request:

jobs:
  # ── 1. TypeScript type-check ──────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npx tsc --noEmit
        run: npx tsc --noEmit

  # ── 2. Agent-evaluation evidence tooling ──────────────────────────────────
  # This validates the hash-checked evidence packer itself. It is deliberately
  # not a public "model intelligence" test; private holdouts and independent
  # review remain required by docs/AGENT-EVALUATION-OPERATOR-GUIDE.md.
  agent-evaluation-tooling:
    name: Agent evaluation evidence tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check and exercise evidence packer
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/package-agent-evaluation-evidence.mjs
          work="$RUNNER_TEMP/copper-agent-evaluation-tooling"
          mkdir -p "$work"
          printf 'CI self-audit transcript\n' > "$work/transcript.txt"
          printf 'CI self-audit tool log\n' > "$work/tool-log.txt"
          printf 'CI self-audit test log\n' > "$work/test-log.txt"
          if node scripts/package-agent-evaluation-evidence.mjs \
            --mode independent --task-id ci-independent-guard \
            --start-sha "$GITHUB_SHA" --end-sha "$GITHUB_SHA" \
            --transcript "$work/transcript.txt" --tool-log "$work/tool-log.txt" \
            --test-log "$work/test-log.txt" --out "$work/should-not-exist.json"; then
            echo '::error title=Evaluation evidence tooling::Independent mode accepted a missing holdout/reviewer attestation.'
            exit 1
          fi
          node scripts/package-agent-evaluation-evidence.mjs \
            --mode self-audit --task-id ci-self-audit \
            --start-sha "$GITHUB_SHA" --end-sha "$GITHUB_SHA" \
            --transcript "$work/transcript.txt" --tool-log "$work/tool-log.txt" \
            --test-log "$work/test-log.txt" --out "$work/evidence.json"
          node scripts/package-agent-evaluation-evidence.mjs --verify --bundle "$work/evidence.json"

  # ── 3. Runtime release-promotion gate ─────────────────────────────────────
  # This creates a synthetic plumbing fixture only. It proves the release gate
  # fails closed without owner configuration and that a valid release manifest
  # is consumable by Android release staging; it never represents a runtime.
  copper-runtime-release-promotion-tooling:
    name: Copper Runtime release-promotion gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Exercise release-promotion gate with synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/promote-copper-runtime-release.mjs
          work="$RUNNER_TEMP/copper-release-promotion-gate"
          mkdir -p "$work/input"
          cp runtime/copper-runtime.config.json "$work/original-config.json"
          restore_config() { cp "$work/original-config.json" runtime/copper-runtime.config.json; }
          trap restore_config EXIT
          python3 - "$work/input" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          output = pathlib.Path(sys.argv[1])
          archive = output / 'copper-runtime-bootstrap-aarch64.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as value:
              value.writestr('bin/bash', '# synthetic release-gate fixture only\\n')
              value.writestr('SYMLINKS.txt', '')
          source = output / 'copper-runtime-corresponding-source.tar.gz'
          source.write_bytes(b'synthetic corresponding source fixture only\\n')
          manifest = {
              'schemaVersion': 1,
              'product': 'Copper Runtime',
              'createdAt': '2026-09-05T00:00:00.000Z',
              'architecture': 'aarch64',
              'applicationId': 'com.copper.chat',
              'runtimePrefix': '/data/data/com.copper.chat/files/usr',
              'runtimeHome': '/data/data/com.copper.chat/files/home',
              'file': archive.name,
              'sizeBytes': archive.stat().st_size,
              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'upstream': {'fixture': 'synthetic-only'},
              'extraBootstrapPackages': [],
              'publishable': False,
              'publishBlocker': 'Synthetic fixture begins as an unpublishable source-build input.'
          }
          (output / f'{archive.name}.json').write_text(json.dumps(manifest), encoding='utf-8')
          PY
          if node scripts/promote-copper-runtime-release.mjs \
            --archive "$work/input/copper-runtime-bootstrap-aarch64.zip" \
            --build-manifest "$work/input/copper-runtime-bootstrap-aarch64.zip.json" \
            --source-bundle "$work/input/copper-runtime-corresponding-source.tar.gz" \
            --source-url https://sources.copper.invalid/releases/copper-runtime-corresponding-source.tar.gz \
            --asset-url https://downloads.copper.invalid/releases/r2026.09.05/copper-runtime-bootstrap-aarch64.zip \
            --release-id r2026.09.05-arm64.1 --out "$work/unconfigured-output"; then
            echo '::error title=Copper release promotion::Unconfigured owner repository/key settings were accepted.'
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const configPath = 'runtime/copper-runtime.config.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.repository.baseUrl = 'https://packages.copper.invalid/apt';
          config.repository.signing.keyFingerprint = '0123456789abcdef0123456789abcdef01234567';
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          node scripts/promote-copper-runtime-release.mjs \
            --archive "$work/input/copper-runtime-bootstrap-aarch64.zip" \
            --build-manifest "$work/input/copper-runtime-bootstrap-aarch64.zip.json" \
            --source-bundle "$work/input/copper-runtime-corresponding-source.tar.gz" \
            --source-url https://sources.copper.invalid/releases/copper-runtime-corresponding-source.tar.gz \
            --asset-url https://downloads.copper.invalid/releases/r2026.09.05/copper-runtime-bootstrap-aarch64.zip \
            --release-id r2026.09.05-arm64.1 --out "$work/release-candidate"
          node scripts/stage-copper-runtime-android-assets.mjs \
            --archive "$work/release-candidate/copper-runtime-bootstrap-aarch64.zip" \
            --manifest "$work/release-candidate/copper-runtime-bootstrap-aarch64.zip.json" \
            --out "$work/android-assets/copper-runtime" --mode release
          node - "$work/release-candidate" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const candidate = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path.join(candidate, 'copper-runtime-bootstrap-aarch64.zip.json'), 'utf8'));
          if (manifest.schemaVersion !== 1 || manifest.publishable !== true || manifest.publication?.immutableUrlRequired !== true) {
            throw new Error('release manifest did not retain required promotion fields');
          }
          if (!manifest.correspondingSource?.sha256 || !manifest.sourceBuild?.inputManifestSha256) {
            throw new Error('release manifest omitted source provenance');
          }
          const stageReceipt = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'copper-release-promotion-gate/android-assets/copper-runtime/copper-runtime-stage-receipt.json'), 'utf8'));
          if (stageReceipt.mode !== 'release' || stageReceipt.candidateOnly !== false) {
            throw new Error('release staging receipt did not retain the released-asset label');
          }
          NODE
          restore_config
          trap - EXIT
          cmp -s runtime/copper-runtime.config.json "$work/original-config.json"

  # ── 4. Web bundle smoke test ──────────────────────────────────────────────
  web-bundle-smoke:
    name: Web bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: expo export --platform web
        run: npx expo export --platform web --output-dir dist-ci
        env:
          CI: true

      - name: Verify index.html exists
        run: test -f dist-ci/index.html

  # ── 5. Locked full-bootstrap provenance for asset validation ──────────────
  # An installer-validation commit must prove which *earlier* successful source
  # bootstrap it consumes. This is deliberately a short API attestation, not a
  # second multi-hour source build; the latter remains opt-in below.
  copper-runtime-bootstrap-provenance:
    name: Copper Runtime successful arm64 bootstrap provenance
    if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[runtime-asset-validation]') || contains(github.event.head_commit.message, '[runtime-device-candidate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      COPPER_BOOTSTRAP_RUN_ID: '33871619836'
      COPPER_BOOTSTRAP_ARTIFACT_ID: '9939259618'
      COPPER_BOOTSTRAP_ARTIFACT_DIGEST: 'sha256:e1ded88255b22637683e2a32592ccbb0647e66ab86cc3b9ae6f9a769aa6b76de'
      COPPER_BOOTSTRAP_HEAD_SHA: 'effec23f6e6ead349c65e2b5b7f489efd46105d4'
      COPPER_BOOTSTRAP_ARTIFACT_NAME: copper-runtime-bootstrap-aarch64
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Attest successful source bootstrap and retained artifact
        shell: bash
        run: |
          set -euo pipefail
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COPPER_BOOTSTRAP_RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$source_run")" = success
          test "$(jq -r '.head_sha' <<<"$source_run")" = "$COPPER_BOOTSTRAP_HEAD_SHA"
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$COPPER_BOOTSTRAP_ARTIFACT_ID")"
          test "$(jq -r '.name' <<<"$artifact")" = "$COPPER_BOOTSTRAP_ARTIFACT_NAME"
          test "$(jq -r '.digest' <<<"$artifact")" = "$COPPER_BOOTSTRAP_ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$COPPER_BOOTSTRAP_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "$COPPER_BOOTSTRAP_HEAD_SHA"
          test "$(jq -r '.expired' <<<"$artifact")" = false
          {
            echo '### Copper Runtime source-bootstrap provenance'
            echo
            echo "- Source bootstrap run: \`$COPPER_BOOTSTRAP_RUN_ID\` (**success**)"
            echo "- Pinned source commit: \`$COPPER_BOOTSTRAP_HEAD_SHA\`"
            echo "- Retained artifact: \`$COPPER_BOOTSTRAP_ARTIFACT_NAME\` / \`$COPPER_BOOTSTRAP_ARTIFACT_ID\`"
            echo "- GitHub artifact-envelope digest: \`$COPPER_BOOTSTRAP_ARTIFACT_DIGEST\`"
            echo '- This attests the existing source build; it does not rerun it.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 6. On-demand Copper Runtime source preflight / bootstrap ──────────────
  # Both paths are deliberately opt-in by commit message. The standalone manual
  # workflow becomes dispatchable once its file reaches the default branch.
  copper-runtime-bootstrap:
    name: Copper Runtime arm64 source build (opt-in)
    # A source bootstrap is expensive. Do not start either the pinned package
    # preflight or the source bootstrap until the compiled-and-executed Android
    # PTY transport gate has passed.
    needs: copper-native-runtime-compile
    if: ${{ always() && github.event_name == 'push' && (contains(github.event.head_commit.message, '[runtime-bootstrap]') || contains(github.event.head_commit.message, '[runtime-preflight]')) && needs.copper-native-runtime-compile.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Termux's source bootstrap builds use the Docker toolchain plus many
      # intermediate package build trees. GitHub's image ships SDK/.NET/Haskell
      # payloads that are irrelevant to this Linux-only job and otherwise let
      # the runner itself exhaust its filesystem mid-build.
      - name: Reclaim runner disk for Copper package builds
        run: |
          set -euo pipefail
          TOOLCACHE="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            "$TOOLCACHE"
          sudo apt-get clean
          docker system prune --all --force || true
          AVAILABLE_BYTES="$(df -B1 --output=avail / | tail -1 | tr -d '[:space:]')"
          REQUIRED_BYTES=$((40 * 1024 * 1024 * 1024))
          df -h /
          docker system df || true
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "::error title=Copper bootstrap capacity::Only $AVAILABLE_BYTES bytes are free after cleanup; at least $REQUIRED_BYTES bytes are required before the source build starts."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Copper tooling
        run: npm ci --ignore-scripts

      - name: Fetch and patch pinned GPL upstream sources
        run: |
          npm run runtime:upstream -- --dir "$RUNNER_TEMP/copper-runtime-source"
          npm run runtime:patch -- --workspace "$RUNNER_TEMP/copper-runtime-source"

      - name: Run Copper arm64 package preflight or bootstrap
        env:
          COPPER_RUNTIME_PREFLIGHT_ONLY: ${{ contains(github.event.head_commit.message, '[runtime-preflight]') }}
        run: |
          set -o pipefail
          args=()
          if [ "$COPPER_RUNTIME_PREFLIGHT_ONLY" = "true" ]; then
            args+=(--preflight-only)
          fi
          npm run runtime:bootstrap -- \
            --workspace "$RUNNER_TEMP/copper-runtime-source" \
            --out "$RUNNER_TEMP/copper-runtime-output" \
            "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/copper-runtime-bootstrap-build.log"

      - name: Surface bootstrap diagnostics on failure
        # This makes a concise failure visible through check annotations even
        # when a client cannot reach GitHub Actions' artifact blob endpoint.
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/copper-runtime-bootstrap-build.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=Copper bootstrap::The bootstrap failed before its build log was created."
            exit 0
          fi
          mapfile -t diagnostics < <(
            {
              # Include component lines following Gradle's SDK-install header;
              # without this context an annotation hides the actionable names.
              grep -Ei --no-group-separator -A6 'failed to install the following sdk components' "$LOG" || true
              # Keep annotations tied to a terminating runtime-builder error.
              # Do not grep broad words such as "error", "syntax error", or
              # "out of memory": package source text legitimately contains
              # them and previously produced misleading false positives.
              grep -Ei -A4 'copper runtime bootstrap build failed:|bootstrap integrity verification failed:|bootstrap is missing required runtime entry|could not inspect required runtime entry|could not read bootstrap symlink manifest|build reported success but did not create|bootstrap archive is unexpectedly small|no space left on device|no rule to make target|failed to install the following sdk components|failed to read or create install properties|failed to download https?://|curl: \((22|28)\)' "$LOG" || true
            } | awk 'NF && !seen[$0]++' | tail -20
          )
          if [ "${#diagnostics[@]}" -eq 0 ]; then
            echo "::error title=Copper bootstrap::Bootstrap failed without a recognizable diagnostic. Open the retained build log artifact; no ordinary build-output lines were relabeled as errors."
            exit 0
          fi
          for line in "${diagnostics[@]}"; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Copper bootstrap::$line"
          done

      - name: Upload bootstrap build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-bootstrap-build-log
          path: ${{ runner.temp }}/copper-runtime-bootstrap-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified bootstrap input
        if: ${{ !contains(github.event.head_commit.message, '[runtime-preflight]') }}
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-bootstrap-aarch64
          path: ${{ runner.temp }}/copper-runtime-output/
          if-no-files-found: error
          retention-days: 14

  # ── 7. On-demand Android native module compilation ────────────────────────
  # Uses a marker because NDK/Gradle compilation is much slower than the normal
  # Android JS-bundle smoke test below.
  copper-native-runtime-compile:
    name: Copper Runtime native PTY validation
    # Run independently on direct native changes and as a required, fast gate
    # before every expensive source bootstrap build.
    if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[native-compile]') || contains(github.event.head_commit.message, '[runtime-preflight]') || contains(github.event.head_commit.message, '[runtime-bootstrap]') || contains(github.event.head_commit.message, '[runtime-asset-validation]') || contains(github.event.head_commit.message, '[runtime-device-candidate]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      # Preserve the Android SDK, Node, and JDK used by this job, but remove
      # unrelated toolchains before downloading an AVD. The prior API-35 image
      # left only 89 MB free, so the emulator could not reach ADB.
      - name: Reclaim runner disk for Android PTY validation
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell
          sudo apt-get clean
          AVAILABLE_BYTES="$(df -B1 --output=avail / | tail -1 | tr -d '[:space:]')"
          REQUIRED_BYTES=$((12 * 1024 * 1024 * 1024))
          df -h /
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "::error title=Copper Android PTY capacity::Only $AVAILABLE_BYTES bytes are free after safe cleanup; at least $REQUIRED_BYTES bytes are required before downloading and booting the Android test image."
            exit 1
          fi

      - name: Install dependencies and generate Android project
        run: |
          npm ci --ignore-scripts
          npx expo prebuild --platform android --clean

      - name: Compile Copper native module and PTY library
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :copper-exec:assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/copper-native-build.log"
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Copper PTY transport on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The emulator action evaluates each supplied script line separately
          # with /bin/sh. Keep this as one Bash command so cd persists and
          # pipefail preserves an actual test failure behind tee.
          script: >-
            bash -e -o pipefail -c 'cd "$GITHUB_WORKSPACE/android" && chmod +x gradlew && ./gradlew :copper-exec:connectedDebugAndroidTest --no-daemon 2>&1 | tee "$RUNNER_TEMP/copper-native-pty-test.log"'
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Surface native compiler diagnostics on failure
        # The retained log is authoritative. These concise annotations also
        # make compiler failures visible when an environment cannot download
        # GitHub Actions' artifact blob directly.
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          LOGS=(
            "$RUNNER_TEMP/copper-native-build.log"
            "$RUNNER_TEMP/copper-native-pty-test.log"
          )
          if [ ! -f "${LOGS[0]}" ] && [ ! -f "${LOGS[1]}" ]; then
            echo "::error title=Copper native PTY validation::Gradle or emulator failed before a diagnostic log was created."
            exit 0
          fi
          mapfile -t diagnostics < <(
            grep -Eh '(^|[[:space:]])(e:|error:|FAILURE:|Execution failed|What went wrong|BUILD FAILED|Tests? [0-9]+ failed)' "${LOGS[@]}" 2>/dev/null | tail -20 || true
          )
          if [ "${#diagnostics[@]}" -eq 0 ]; then
            echo "::error title=Copper native PTY validation::Validation failed without a recognizable compiler or test diagnostic. Inspect the retained logs and emulator-action output; ordinary successful Gradle output was not relabeled as an error."
            exit 0
          fi
          for line in "${diagnostics[@]}"; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Copper native PTY validation::$line"
          done

      - name: Upload native build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-native-pty-validation-logs
          path: |
            ${{ runner.temp }}/copper-native-build.log
            ${{ runner.temp }}/copper-native-pty-test.log
          if-no-files-found: warn
          retention-days: 14

  # ── 8. Validate installation of the successful arm64 bootstrap ───────────
  # This deliberate, non-publishing gate turns the retained full-build artifact
  # into a temporary Gradle asset and proves Copper's real Android installer.
  # GitHub's x86_64 emulator cannot execute an app-private arm64 ELF through
  # Android's native bridge, so real Copper Bash PTY execution is covered by
  # the same test only on an actual arm64 device. It never substitutes an
  # upstream Termux archive and it never uploads the runtime to Git.
  copper-runtime-bundled-asset-validation:
    name: Copper Runtime bundled arm64 installation validation
    needs: [copper-native-runtime-compile, copper-runtime-bootstrap-provenance]
    if: ${{ always() && github.event_name == 'push' && (contains(github.event.head_commit.message, '[runtime-asset-validation]') || contains(github.event.head_commit.message, '[runtime-device-candidate]')) && needs.copper-native-runtime-compile.result == 'success' && needs.copper-runtime-bootstrap-provenance.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    env:
      COPPER_BOOTSTRAP_RUN_ID: '33871619836'
      COPPER_BOOTSTRAP_ARTIFACT_ID: '9939259618'
      COPPER_BOOTSTRAP_ARTIFACT_DIGEST: 'sha256:e1ded88255b22637683e2a32592ccbb0647e66ab86cc3b9ae6f9a769aa6b76de'
      COPPER_BOOTSTRAP_HEAD_SHA: 'effec23f6e6ead349c65e2b5b7f489efd46105d4'
      COPPER_BOOTSTRAP_ARTIFACT_NAME: copper-runtime-bootstrap-aarch64
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Reclaim runner disk for bundled runtime validation
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell
          sudo apt-get clean
          AVAILABLE_BYTES="$(df -B1 --output=avail / | tail -1 | tr -d '[:space:]')"
          REQUIRED_BYTES=$((14 * 1024 * 1024 * 1024))
          df -h /
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "::error title=Copper bundled runtime capacity::Only $AVAILABLE_BYTES bytes are free; at least $REQUIRED_BYTES bytes are required for the emulator and temporary arm64 asset."
            exit 1
          fi

      - name: Fetch and verify the exact successful Copper runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$COPPER_BOOTSTRAP_ARTIFACT_ID")"
          test "$(jq -r '.name' <<<"$metadata")" = "$COPPER_BOOTSTRAP_ARTIFACT_NAME"
          test "$(jq -r '.digest' <<<"$metadata")" = "$COPPER_BOOTSTRAP_ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$COPPER_BOOTSTRAP_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$metadata")" = "$COPPER_BOOTSTRAP_HEAD_SHA"
          test "$(jq -r '.expired' <<<"$metadata")" = false

          download="$RUNNER_TEMP/copper-runtime-artifact"
          gh run download "$COPPER_BOOTSTRAP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$COPPER_BOOTSTRAP_ARTIFACT_NAME" \
            --dir "$download"
          archive="$(find "$download" -type f -name 'copper-runtime-bootstrap-aarch64.zip' -print -quit)"
          manifest="$(find "$download" -type f -name 'copper-runtime-bootstrap-aarch64.zip.json' -print -quit)"
          test -n "$archive" && test -n "$manifest"
          destination="$GITHUB_WORKSPACE/modules/copper-exec/android/src/main/assets/copper-runtime"
          npm run runtime:stage-android-assets -- \
            --archive "$archive" \
            --manifest "$manifest" \
            --out "$destination" \
            --mode ci-validation
          test -f "$destination/copper-runtime-bootstrap-aarch64.zip"
          test -f "$destination/copper-runtime-bootstrap-aarch64.zip.json"
          du -h "$destination/copper-runtime-bootstrap-aarch64.zip"

      - name: Generate Android project with temporary verified runtime asset
        run: |
          npm ci --ignore-scripts
          npx expo prebuild --platform android --clean

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install verified arm64 bootstrap on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: >-
            bash -o pipefail -c 'cd "$GITHUB_WORKSPACE/android" && chmod +x gradlew && ./gradlew :copper-exec:connectedDebugAndroidTest -PcopperRuntimeAllowForeignAbiForTest=true --no-daemon 2>&1 | tee "$RUNNER_TEMP/copper-bundled-runtime-validation.log"; test_status=${PIPESTATUS[0]}; if [ "$test_status" -ne 0 ]; then adb logcat -d -v threadtime > "$RUNNER_TEMP/copper-bundled-runtime-validation-logcat.txt" || true; fi; exit "$test_status"'
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Extract Android instrumentation failure detail
        # Gradle's top-level error only says that a test failed. Convert its
        # XML failure body into a small plain-text report while it is still on
        # the runner, so the following annotation is useful even when external
        # clients cannot reach Actions' Azure artifact blob endpoint.
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/copper-bundled-runtime-test-report.txt"
          python3 - "$GITHUB_WORKSPACE" "$report" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          workspace = Path(sys.argv[1])
          report_path = Path(sys.argv[2])
          # AGP has moved this output between module-local and generated-app
          # paths across plugin releases. Discover only Android test result XML
          # under build directories instead of assuming one fragile location.
          candidates = sorted({path for path in workspace.glob("**/build/**/androidTest-results/**/*.xml") if path.is_file()})
          lines = [f"Android test XML candidates: {len(candidates)}"]
          for path in candidates:
              lines.append(f"RESULT XML: {path.relative_to(workspace)}")
              try:
                  suite = ET.parse(path).getroot()
              except ET.ParseError as error:
                  lines.append(f"Unreadable Android test XML: {error}")
                  continue
              for case in suite.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  label = f"{case.get('classname', '<unknown>')}.{case.get('name', '<unknown>')}"
                  message = failure.get("message", "")
                  detail = (failure.text or "").strip()
                  lines.append(f"FAILED TEST: {label}\n{message}\n{detail}".strip())
          report_path.write_text("\n\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat "$report"

      - name: Surface bundled runtime diagnostics on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          LOGS=(
            "$RUNNER_TEMP/copper-bundled-runtime-validation.log"
            "$RUNNER_TEMP/copper-bundled-runtime-test-report.txt"
            "$RUNNER_TEMP/copper-bundled-runtime-validation-logcat.txt"
          )
          if [ ! -f "${LOGS[0]}" ] && [ ! -f "${LOGS[1]}" ] && [ ! -f "${LOGS[2]}" ]; then
            echo "::error title=Copper bundled runtime validation::Validation failed before Gradle, emulator, or Android test diagnostics were created."
            exit 0
          fi
          mapfile -t diagnostics < <(
            grep -E -A12 'Android test XML candidates:|RESULT XML:|FAILED TEST:|Copper Runtime|Copper Bash|bootstrap|AssertionError|IllegalStateException|SecurityException|UnsatisfiedLinkError|FATAL EXCEPTION|FAILURE:|Execution failed|BUILD FAILED|Tests? [0-9]+ failed|error:' "${LOGS[@]}" 2>/dev/null | tail -60 || true
          )
          if [ "${#diagnostics[@]}" -eq 0 ]; then
            echo "::error title=Copper bundled runtime validation::The real bundled-runtime test failed without a concise diagnostic; inspect the retained validation log and XML report."
            exit 0
          fi
          for line in "${diagnostics[@]}"; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Copper bundled runtime validation::$line"
          done

      - name: Upload bundled runtime validation log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-bundled-asset-validation-log
          path: |
            ${{ runner.temp }}/copper-bundled-runtime-validation.log
            ${{ runner.temp }}/copper-bundled-runtime-test-report.txt
            ${{ runner.temp }}/copper-bundled-runtime-validation-logcat.txt
          if-no-files-found: warn
          retention-days: 14

  # ── 9. Personal device-candidate APK from the verified source artifact ────
  # This job exists for the project owner's physical arm64-phone test. It
  # embeds the exact temporary source-build asset in device-candidate mode;
  # neither the APK nor its Actions artifact is a runtime release.
  copper-runtime-device-candidate-apk:
    name: Copper Runtime personal arm64 device-candidate APK
    needs: copper-runtime-bundled-asset-validation
    if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[runtime-device-candidate]') && needs.copper-runtime-bundled-asset-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    env:
      COPPER_BOOTSTRAP_RUN_ID: '33871619836'
      COPPER_BOOTSTRAP_ARTIFACT_ID: '9939259618'
      COPPER_BOOTSTRAP_ARTIFACT_DIGEST: 'sha256:e1ded88255b22637683e2a32592ccbb0647e66ab86cc3b9ae6f9a769aa6b76de'
      COPPER_BOOTSTRAP_HEAD_SHA: 'effec23f6e6ead349c65e2b5b7f489efd46105d4'
      COPPER_BOOTSTRAP_ARTIFACT_NAME: copper-runtime-bootstrap-aarch64
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Fetch the exact verified Copper runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$COPPER_BOOTSTRAP_ARTIFACT_ID")"
          test "$(jq -r '.name' <<<"$metadata")" = "$COPPER_BOOTSTRAP_ARTIFACT_NAME"
          test "$(jq -r '.digest' <<<"$metadata")" = "$COPPER_BOOTSTRAP_ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$COPPER_BOOTSTRAP_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$metadata")" = "$COPPER_BOOTSTRAP_HEAD_SHA"
          test "$(jq -r '.expired' <<<"$metadata")" = false
          download="$RUNNER_TEMP/copper-runtime-device-candidate-input"
          gh run download "$COPPER_BOOTSTRAP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$COPPER_BOOTSTRAP_ARTIFACT_NAME" \
            --dir "$download"
          archive="$(find "$download" -type f -name 'copper-runtime-bootstrap-aarch64.zip' -print -quit)"
          manifest="$(find "$download" -type f -name 'copper-runtime-bootstrap-aarch64.zip.json' -print -quit)"
          test -n "$archive" && test -n "$manifest"
          printf '%s\n' "$archive" > "$RUNNER_TEMP/copper-runtime-device-candidate-archive-path"
          printf '%s\n' "$manifest" > "$RUNNER_TEMP/copper-runtime-device-candidate-manifest-path"

      - name: Install dependencies and stage personal device-candidate assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          archive="$(cat "$RUNNER_TEMP/copper-runtime-device-candidate-archive-path")"
          manifest="$(cat "$RUNNER_TEMP/copper-runtime-device-candidate-manifest-path")"
          destination="$GITHUB_WORKSPACE/modules/copper-exec/android/src/main/assets/copper-runtime"
          npm run runtime:stage-android-assets -- \
            --archive "$archive" --manifest "$manifest" --out "$destination" \
            --mode device-candidate
          test "$(jq -r '.mode' "$destination/copper-runtime-stage-receipt.json")" = device-candidate
          test "$(jq -r '.candidateOnly' "$destination/copper-runtime-stage-receipt.json")" = true

      - name: Generate Android project with the real Copper runtime candidate
        run: npx expo prebuild --platform android --clean
        env:
          CI: true

      - name: Build personal device-candidate APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          # The Copper runtime asset is arm64-only. Do not bloat a personal
          # arm64-phone candidate with React Native native libraries for x86
          # emulators or 32-bit Android devices.
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Report APK and bundled-runtime sizes
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          asset="modules/copper-exec/android/src/main/assets/copper-runtime/copper-runtime-bootstrap-aarch64.zip"
          test -n "$apk" && test -f "$asset"
          listing="$RUNNER_TEMP/copper-runtime-device-candidate-apk-listing.txt"
          if ! unzip -l "$apk" > "$listing"; then
            echo "::error title=Copper candidate APK size report::The built APK could not be read as a ZIP: $apk"
            file "$apk" || true
            unzip -t "$apk" || true
            exit 1
          fi
          largest="$RUNNER_TEMP/copper-runtime-device-candidate-largest-entries.txt"
          awk 'NR > 3 && $1 ~ /^[0-9]+$/ { print $1 "  " $4 }' "$listing" | sort -nr > "$largest"
          {
            echo '### Copper personal device-candidate size report'
            echo
            echo '- Candidate target: `arm64-v8a` only'
            echo "- APK bytes: \`$(stat -c '%s' "$apk")\`"
            echo "- Bundled runtime ZIP bytes: \`$(stat -c '%s' "$asset")\`"
            echo
            echo 'Largest APK entries:'
            echo '```text'
            head -20 "$largest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble candidate download with provenance label
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          candidate="$RUNNER_TEMP/copper-runtime-device-candidate"
          mkdir -p "$candidate"
          cp "$apk" "$candidate/Copper-runtime-device-candidate.apk"
          cp modules/copper-exec/android/src/main/assets/copper-runtime/copper-runtime-bootstrap-aarch64.zip.json "$candidate/"
          cp modules/copper-exec/android/src/main/assets/copper-runtime/copper-runtime-stage-receipt.json "$candidate/"
          cat > "$candidate/README-PERSONAL-DEVICE-CANDIDATE.txt" <<'EOF'
          This APK contains the real verified Copper arm64 runtime for the project owner's personal physical-device test.
          It is not a released Copper Runtime APK and not a package-repository validation.
          Do not describe it as a runtime release or distribute it as one.
          EOF

      - name: Surface device-candidate diagnostics on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -u
          echo '### Copper personal device-candidate diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated APK files:'
          find android/app/build/outputs/apk -type f -printf '%p %s bytes\n' 2>/dev/null || true
          echo 'Staged runtime assets:'
          find modules/copper-exec/android/src/main/assets/copper-runtime -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          apk="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -n "$apk" ]; then
            echo "APK file type: $(file -b "$apk" || true)"
            unzip -t "$apk" || true
          fi

      - name: Upload personal device-candidate APK
        uses: actions/upload-artifact@v6
        with:
          name: Copper-runtime-device-candidate
          path: ${{ runner.temp }}/copper-runtime-device-candidate/
          if-no-files-found: error
          retention-days: 14

  # ── 10. Android JS-bundle smoke test ──────────────────────────────────────
  android-bundle-smoke:
    name: Android bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: expo export --platform android
        run: npx expo export --platform android --output-dir dist-android-ci
        env:
          CI: true

      - name: Verify JS bundle exists
        run: |
          ls dist-android-ci/
          find dist-android-ci -name '*.js' | head -5
          find dist-android-ci -name '*.js' | grep -q . || { echo "No JS bundle found"; exit 1; }
