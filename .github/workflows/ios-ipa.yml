name: iOS IPA (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npx expo prebuild -p ios --clean
        run: npx expo prebuild -p ios --clean
        env:
          CI: true

      - name: Detect workspace & scheme
        id: xcode
        run: |
          WS=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"   >> "$GITHUB_OUTPUT"
          echo "Detected workspace: $WS  scheme: $SCHEME"

      - name: xcodebuild Release (CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme     "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination  'generic/platform=iOS' \
            -derivedDataPath /tmp/derived \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            2>&1 | xcpretty --color || true

      - name: Package as Copper-unsigned.ipa
        run: |
          # xcodebuild puts the .app in Release-iphoneos when SKIP_INSTALL=NO
          APP=$(find /tmp/derived/Build/Products -name '*.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found under /tmp/derived/Build/Products — listing:"
            find /tmp/derived -name '*.app' | head -20
            exit 1
          fi
          echo "Packaging: $APP"
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp
          zip -qr Copper-unsigned.ipa Payload/
          echo "IPA size: $(du -sh Copper-unsigned.ipa | cut -f1)"

      - name: Upload Copper-unsigned.ipa
        uses: actions/upload-artifact@v6
        with:
          name: Copper-unsigned-ipa
          path: /tmp/Copper-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
