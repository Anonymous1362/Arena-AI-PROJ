name: iOS IPA (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean
        env:
          CI: true

      - name: xcodebuild Release (no signing)
        run: |
          xcodebuild \
            -workspace ios/copper.xcworkspace \
            -scheme copper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/derived \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            | xcpretty || true

      - name: Package as Copper-unsigned.ipa
        run: |
          APP=$(find /tmp/derived -name '*.app' | head -1)
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp
          zip -qr Copper-unsigned.ipa Payload/

      - name: Upload Copper-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Copper-unsigned-ipa
          path: /tmp/Copper-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
