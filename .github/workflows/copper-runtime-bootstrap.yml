name: Copper Runtime Bootstrap

on:
  workflow_dispatch:
    inputs:
      additional_bootstrap_packages:
        description: "Optional comma-separated packages to include in the arm64 bootstrap (for example: git,curl)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: copper-runtime-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64-bootstrap:
    name: Build Copper-prefix arm64 bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Bootstrap package builds need their Docker toolchain and many temporary
      # source/build trees. Remove runner image payloads unused by this
      # Linux-only workflow before starting so package builds do not fill /.
      - name: Reclaim runner disk for Copper package builds
        run: |
          set -euo pipefail
          TOOLCACHE="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            "$TOOLCACHE"
          sudo apt-get clean
          docker system prune --all --force || true
          AVAILABLE_BYTES="$(df -B1 --output=avail / | tail -1 | tr -d '[:space:]')"
          REQUIRED_BYTES=$((40 * 1024 * 1024 * 1024))
          df -h /
          docker system df || true
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "::error title=Copper bootstrap capacity::Only $AVAILABLE_BYTES bytes are free after cleanup; at least $REQUIRED_BYTES bytes are required before the source build starts."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Copper tooling
        run: npm ci --ignore-scripts

      - name: Fetch pinned GPL upstream sources
        run: npm run runtime:upstream -- --dir "$RUNNER_TEMP/copper-runtime-source"

      - name: Apply Copper-prefix package patch
        run: npm run runtime:patch -- --workspace "$RUNNER_TEMP/copper-runtime-source"

      - name: Build and verify bootstrap
        env:
          EXTRA_BOOTSTRAP_PACKAGES: ${{ inputs.additional_bootstrap_packages }}
        run: |
          set -euo pipefail
          EXTRA="$EXTRA_BOOTSTRAP_PACKAGES"
          {
            if [ -n "$EXTRA" ]; then
              npm run runtime:bootstrap -- \
                --workspace "$RUNNER_TEMP/copper-runtime-source" \
                --out "$RUNNER_TEMP/copper-runtime-output" \
                --add "$EXTRA"
            else
              npm run runtime:bootstrap -- \
                --workspace "$RUNNER_TEMP/copper-runtime-source" \
                --out "$RUNNER_TEMP/copper-runtime-output"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/copper-runtime-bootstrap-build.log"

      - name: Surface bootstrap diagnostics on failure
        # This makes a concise failure visible through check annotations even
        # when a client cannot reach GitHub Actions' artifact blob endpoint.
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/copper-runtime-bootstrap-build.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=Copper bootstrap::The bootstrap failed before its build log was created."
            exit 0
          fi
          mapfile -t diagnostics < <(
            grep -Ei 'no space left|out of (disk|memory)|(^|[^[:alpha:]])error:|(^|[^[:alpha:]])failure:|failed to install|could not determine|build failed|copper runtime bootstrap build failed' "$LOG" | tail -20 || true
          )
          if [ "${#diagnostics[@]}" -eq 0 ]; then
            echo "::error title=Copper bootstrap::Bootstrap failed without a recognizable diagnostic. Open the retained build log artifact; no ordinary build-output lines were relabeled as errors."
            exit 0
          fi
          for line in "${diagnostics[@]}"; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Copper bootstrap::$line"
          done

      - name: Upload bootstrap build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-bootstrap-build-log
          path: ${{ runner.temp }}/copper-runtime-bootstrap-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show verified runtime input
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/copper-runtime-output" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          cat "$RUNNER_TEMP/copper-runtime-output/copper-runtime-bootstrap-aarch64.zip.json"

      - name: Upload unpublishable bootstrap input
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-bootstrap-aarch64
          path: ${{ runner.temp }}/copper-runtime-output/
          if-no-files-found: error
          retention-days: 14
