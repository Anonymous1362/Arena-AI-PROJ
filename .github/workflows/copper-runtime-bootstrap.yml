name: Copper Runtime Bootstrap

on:
  workflow_dispatch:
    inputs:
      additional_bootstrap_packages:
        description: "Optional comma-separated packages to include in the arm64 bootstrap (for example: git,curl)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: copper-runtime-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A manual full bootstrap must obey the same device-level PTY gate as the
  # marker-driven CI path. This runs on its own runner before the package job
  # reclaims that runner's Android payload for Docker source compilation.
  native-pty-preflight:
    name: Copper Runtime native PTY validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Reclaim runner disk for Android PTY validation
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell
          sudo apt-get clean
          AVAILABLE_BYTES="$(df -B1 --output=avail / | tail -1 | tr -d '[:space:]')"
          REQUIRED_BYTES=$((12 * 1024 * 1024 * 1024))
          df -h /
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "::error title=Copper Android PTY capacity::Only $AVAILABLE_BYTES bytes are free after safe cleanup; at least $REQUIRED_BYTES bytes are required before downloading and booting the Android test image."
            exit 1
          fi

      - name: Install dependencies and generate Android project
        run: |
          npm ci --ignore-scripts
          npx expo prebuild --platform android --clean

      - name: Compile Copper native module and PTY library
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :copper-exec:assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/copper-native-build.log"
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Copper PTY transport on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # This action evaluates each supplied script line separately with
          # /bin/sh. Keep the command on one Bash line so cd and pipefail hold.
          script: >-
            bash -e -o pipefail -c 'cd "$GITHUB_WORKSPACE/android" && chmod +x gradlew && ./gradlew :copper-exec:connectedDebugAndroidTest --no-daemon 2>&1 | tee "$RUNNER_TEMP/copper-native-pty-test.log"'
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

  build-arm64-bootstrap:
    name: Build Copper-prefix arm64 bootstrap
    needs: native-pty-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Bootstrap package builds need their Docker toolchain and many temporary
      # source/build trees. Remove runner image payloads unused by this
      # Linux-only workflow before starting so package builds do not fill /.
      - name: Reclaim runner disk for Copper package builds
        run: |
          set -euo pipefail
          TOOLCACHE="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            "$TOOLCACHE"
          sudo apt-get clean
          docker system prune --all --force || true
          AVAILABLE_BYTES="$(df -B1 --output=avail / | tail -1 | tr -d '[:space:]')"
          REQUIRED_BYTES=$((40 * 1024 * 1024 * 1024))
          df -h /
          docker system df || true
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "::error title=Copper bootstrap capacity::Only $AVAILABLE_BYTES bytes are free after cleanup; at least $REQUIRED_BYTES bytes are required before the source build starts."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Copper tooling
        run: npm ci --ignore-scripts

      - name: Fetch pinned GPL upstream sources
        run: npm run runtime:upstream -- --dir "$RUNNER_TEMP/copper-runtime-source"

      - name: Apply Copper-prefix package patch
        run: npm run runtime:patch -- --workspace "$RUNNER_TEMP/copper-runtime-source"

      - name: Build and verify bootstrap
        env:
          EXTRA_BOOTSTRAP_PACKAGES: ${{ inputs.additional_bootstrap_packages }}
        run: |
          set -euo pipefail
          EXTRA="$EXTRA_BOOTSTRAP_PACKAGES"
          {
            if [ -n "$EXTRA" ]; then
              npm run runtime:bootstrap -- \
                --workspace "$RUNNER_TEMP/copper-runtime-source" \
                --out "$RUNNER_TEMP/copper-runtime-output" \
                --add "$EXTRA"
            else
              npm run runtime:bootstrap -- \
                --workspace "$RUNNER_TEMP/copper-runtime-source" \
                --out "$RUNNER_TEMP/copper-runtime-output"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/copper-runtime-bootstrap-build.log"

      - name: Surface bootstrap diagnostics on failure
        # This makes a concise failure visible through check annotations even
        # when a client cannot reach GitHub Actions' artifact blob endpoint.
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/copper-runtime-bootstrap-build.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=Copper bootstrap::The bootstrap failed before its build log was created."
            exit 0
          fi
          mapfile -t diagnostics < <(
            {
              # Include component lines following Gradle's SDK-install header;
              # without this context an annotation hides the actionable names.
              grep -Ei --no-group-separator -A6 'failed to install the following sdk components' "$LOG" || true
              # Keep annotations tied to a terminating runtime-builder error.
              # Do not grep broad words such as "error", "syntax error", or
              # "out of memory": package source text legitimately contains
              # them and previously produced misleading false positives.
              grep -Ei -A4 'copper runtime bootstrap build failed:|bootstrap integrity verification failed:|bootstrap is missing required runtime entry:|could not inspect required runtime entry|build reported success but did not create|bootstrap archive is unexpectedly small|no space left on device|no rule to make target|failed to install the following sdk components|failed to read or create install properties' "$LOG" || true
            } | awk 'NF && !seen[$0]++' | tail -20
          )
          if [ "${#diagnostics[@]}" -eq 0 ]; then
            echo "::error title=Copper bootstrap::Bootstrap failed without a recognizable diagnostic. Open the retained build log artifact; no ordinary build-output lines were relabeled as errors."
            exit 0
          fi
          for line in "${diagnostics[@]}"; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Copper bootstrap::$line"
          done

      - name: Upload bootstrap build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-bootstrap-build-log
          path: ${{ runner.temp }}/copper-runtime-bootstrap-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show verified runtime input
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/copper-runtime-output" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          cat "$RUNNER_TEMP/copper-runtime-output/copper-runtime-bootstrap-aarch64.zip.json"

      - name: Upload unpublishable bootstrap input
        uses: actions/upload-artifact@v6
        with:
          name: copper-runtime-bootstrap-aarch64
          path: ${{ runner.temp }}/copper-runtime-output/
          if-no-files-found: error
          retention-days: 14
