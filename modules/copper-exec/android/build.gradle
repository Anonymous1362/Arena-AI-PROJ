plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.copper.copperexec'
version = '1.0.0'

android {
  namespace "com.copper.copperexec"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    externalNativeBuild {
      cmake {
        cppFlags "-std=c11"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path file("src/main/cpp/CMakeLists.txt")
      version "3.22.1"
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
